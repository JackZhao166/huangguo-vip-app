name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      # 第 1 关：作者机器上写死的 Flutter SDK 绝对路径
      - name: Fix hardcoded Flutter SDK path
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "$FLUTTER_SDK" > android/local.properties
          sed -i "s#/vol1/@appshare/octop-native/data/.octop/agents/alan/flutter-sdk#$FLUTTER_SDK#g" \
            android/settings.gradle

      # 第 2 关：KGP 2.4 要求 AGP >= 8.5.2；AGP 8.5 要求 Gradle >= 8.7
      # 这个检查是 KGP 自己抛的，flag 跳不过，必须保留
      - name: Align AGP and Gradle wrapper
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path("android")
          for name in ("settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"):
              p = root / name
              if not p.exists():
                  continue
              s = p.read_text()
              s = re.sub(r'(com\.android\.tools\.build:gradle:)[0-9.]+', r'\g<1>8.5.2', s)
              s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[0-9.]+(["\'])',
                         r'\g<1>8.5.2\g<2>', s)
              p.write_text(s)
          w = root / "gradle/wrapper/gradle-wrapper.properties"
          if w.exists():
              s = w.read_text()
              s = re.sub(r'(distributionUrl\s*=\s*.*gradle-)[0-9.]+(-(all|bin)\.zip)',
                         r'\g<1>8.7\g<2>', s)
              w.write_text(s)
              print(s)
          PY

      # 第 3 关：Flutter 3.50 的 Gradle/AGP 下限校验 —— 本次新增
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
