name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Ensure Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Regenerate Android scaffold
        run: |
          set -e
          NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "project name = $NAME"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -a lib /tmp/lib_backup
          rm -rf android .metadata
          flutter create --platforms=android --org com.huangguo --project-name "$NAME" .
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -rf lib && cp -a /tmp/lib_backup lib

      - name: Restore network config
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest\b[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\b',
                         '<application android:usesCleartextTraffic="true"', s, count=1)
          p.write_text(s)
          print(s)
          PY

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
