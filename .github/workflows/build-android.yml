name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - name: Pub get
        run: flutter pub get

      # 修掉作者机器上写死的 Flutter SDK 绝对路径
      - name: Fix hardcoded Flutter SDK path
        run: |
          FLUTTER_SDK="$(dirname "$(dirname "$(readlink -f "$(which flutter)")")")"
          printf 'sdk.dir=%s\nflutter.sdk=%s\n' \
            "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" "$FLUTTER_SDK" > android/local.properties
          sed -i "s#/vol1/@appshare/octop-native/data/.octop/agents/alan/flutter-sdk#$FLUTTER_SDK#g" \
            android/settings.gradle

      # 关键：AGP 8.1.0 -> 8.5.2，Gradle wrapper -> 8.7（两者必须一起改）
      - name: Align AGP and Gradle wrapper
        run: |
          python3 - <<'PY'
          import re, pathlib
          root = pathlib.Path("android")
          for name in ("settings.gradle", "settings.gradle.kts", "build.gradle", "build.gradle.kts"):
              p = root / name
              if not p.exists():
                  continue
              s = p.read_text()
              # 旧式 buildscript: classpath 'com.android.tools.build:gradle:8.1.0'
              s = re.sub(r'(com\.android\.tools\.build:gradle:)[0-9.]+', r'\g<1>8.5.2', s)
              # 新式 plugins DSL: id "com.android.application" version "8.1.0" apply false
              s = re.sub(r'(id\s+["\']com\.android\.application["\']\s+version\s+["\'])[0-9.]+(["\'])',
                         r'\g<1>8.5.2\g<2>', s)
              p.write_text(s)
              print(f"--- {p} ---\n{s}")
          w = root / "gradle/wrapper/gradle-wrapper.properties"
          if w.exists():
              s = w.read_text()
              s = re.sub(r'(distributionUrl\s*=\s*.*gradle-)[0-9.]+(-(all|bin)\.zip)',
                         r'\g<1>8.7\g<2>', s)
              w.write_text(s)
              print(f"--- {w} ---\n{s}")
          PY

      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
