name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      # 核心：备份业务代码 → 删掉混搭的 android/ → 用当前 Flutter 重新生成
      - name: Regenerate Android scaffold
        run: |
          set -e
          NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d '\r')
          echo "project name = $NAME"
          cp pubspec.yaml /tmp/pubspec.yaml
          cp -a lib /tmp/lib_backup
          rm -rf android .metadata
          flutter create --platforms=android --org com.huangguo --project-name "$NAME" .
          cp /tmp/pubspec.yaml pubspec.yaml          # create 可能重写，还原
          rm -rf lib && cp -a /tmp/lib_backup lib   # lib/ 绝对不能被动

      # 补回网络权限与明文 HTTP（原项目是视频客户端，新模板 main manifest 不带 INTERNET）
      - name: Restore network config
        run: |
          python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android.permission.INTERNET' not in s:
              s = re.sub(r'(<manifest\b[^>]*>)',
                         r'\1\n    <uses-permission android:name="android.permission.INTERNET"/>',
                         s, count=1)
          if 'usesCleartextTraffic' not in s:
              s = re.sub(r'<application\b',
                         '<application android:usesCleartextTraffic="true"', s, count=1)
          p.write_text(s)
          print(s)
          PY

      # ubuntu-latest 若缺 API 36 / Build Tools 36，补装（AGP 9.1 的硬要求）
      - name: Ensure Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Pub get
        run: flutter pub get

      # 不需要 --android-skip-build-dependency-validation：新模板天然满足下限
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7
